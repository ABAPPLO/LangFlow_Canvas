services:
  langflow:
    image: ai-capability.tencentcloudcr.com/ai-capability-test/lang-flow:latest
    restart: unless-stopped
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres:5432/langflow
      - LANGFLOW_CONFIG_DIR=/app/langflow
      # Set this to a random string for production
      - LANGFLOW_SECRET_KEY=${LANGFLOW_SECRET_KEY:-change-me-in-production}
    volumes:
      - langflow-data:/app/langflow

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    ports:
      - "5432:5432"
    volumes:
      - langflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  langflow-postgres:
  langflow-data:
